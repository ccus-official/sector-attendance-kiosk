<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
<main class="max-w-2xl mx-auto space-y-4">
  <div class="bg-white rounded-2xl shadow p-4 flex items-center justify-between gap-2">
    <div>
      <h1 class="text-lg font-bold text-teal-800">Dashboard – <span id="secName"></span></h1>
      <p id="who" class="text-xs text-gray-500"></p>
    </div>
    <button id="out" class="border rounded-lg px-3 py-2 text-sm">Ba'i</button>
  </div>

  <div class="bg-white rounded-2xl shadow p-4 space-y-3">
    <div class="flex gap-2 items-center">
      <input id="date" type="date" class="border rounded-lg p-2">
      <button id="csv" class="border rounded-lg px-3 py-2 text-sm">CSV buusi</button>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center text-sm">
      <div class="bg-slate-50 rounded-lg p-2"><b id="nAll" class="text-lg block">0</b>Waliigala</div>
      <div class="bg-green-50 rounded-lg p-2"><b id="nP" class="text-lg block text-green-700">0</b>Argame</div>
      <div class="bg-red-50 rounded-lg p-2"><b id="nA" class="text-lg block text-red-600">0</b>Hin argamne</div>
    </div>
    <div id="list" class="space-y-2"></div>
  </div>

  <div class="bg-white rounded-2xl shadow p-4 space-y-3">
    <h2 class="font-bold text-gray-800">QR Mallatteessaa</h2>
    <p class="text-xs text-gray-500">QR kun daqiiqaa tokkoon jijjiirama. Screen waajjira dura kaa'ii, hojjettoonni foonii isaaniitiin scan godhu.</p>
    <div class="flex gap-2"><button id="qrOn" class="bg-blue-700 text-white rounded-lg px-4 py-2 text-sm">QR Argaasi</button><button id="qrOff" class="border rounded-lg px-4 py-2 text-sm">QR Dhaabi</button></div>
    <div id="qrBox" class="hidden text-center"><div id="qrc" class="flex justify-center"></div><p class="text-xs text-gray-500 mt-2">Daqiiqaa 1 keessatti ofumaan haaromfama</p></div>
  </div>

  <form id="addF" class="bg-white rounded-2xl shadow p-4 space-y-2">
    <h2 class="font-bold text-gray-800">Hojjettaa Haaraa</h2>
    <input id="newCode" required placeholder="Koodii (fkn E001)" maxlength="20" pattern="[A-Za-z0-9_-]+" class="w-full border rounded-lg p-2">
    <input id="newName" required placeholder="Maqaa hojjettaa" class="w-full border rounded-lg p-2">
    <input id="newPin" required placeholder="PIN (lakkoofsa 4–6)" inputmode="numeric" pattern="[0-9]{4,6}" class="w-full border rounded-lg p-2">
    <button class="w-full bg-teal-700 text-white rounded-lg p-2">Dabali</button>
  </form>
  <p id="msg" role="alert" class="text-sm text-center text-red-600"></p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const sec = localStorage.getItem("kiosk_sector_id");
const NAMES = { sec_water:"Bishaanii fi Inarjii", sec_health:"Fayyaa", sec_edu:"Barnootaa", sec_agri:"Qonnaa" };
const d0 = new Date();
$("date").value = d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0")+"-"+String(d0.getDate()).padStart(2,"0");
$("secName").textContent = NAMES[sec] || sec;
let emps = [], att = {};

onAuthStateChanged(auth, async user => {
  if (!user || !sec) { location.href = "./index.html"; return; }
  const a = await getDoc(doc(db, "admins", user.uid));
  if (!a.exists() || a.data().active !== true) { await signOut(auth); location.href = "./index.html"; return; }
  $("who").textContent = user.email + " · " + a.data().role;
  load();
});

async function load() {
  try {
    $("msg").textContent = "";
    const es = await getDocs(query(collection(db, "employees"), where("sectorId", "==", sec)));
    emps = es.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
    const as = await getDocs(query(collection(db, "attendance"), where("sectorId", "==", sec), where("date", "==", $("date").value)));
    att = {}; as.docs.forEach(d => att[d.data().employeeId] = d.data());
    render();
  } catch (e) { $("msg").textContent = "Dogoggora: " + (e.code || e.message); }
}

function render() {
  const L = $("list"); L.innerHTML = "";
  let p = 0;
  if (!emps.length) L.innerHTML = '<p class="text-center text-gray-500 text-sm p-4">Hojjettaan hin jiru. Armaan gaditti dabali.</p>';
  emps.forEach(e => {
    const r = att[e.id]; if (r) p++;
    const row = document.createElement("div");
    row.className = "flex items-center gap-3 border rounded-lg p-2";
    row.innerHTML = `<img class="w-10 h-10 rounded object-cover bg-slate-200"><div class="flex-1 min-w-0"><b class="block truncate"></b><small></small></div><button class="text-gray-400 px-2" aria-label="Haqi">✕</button>`;
    const img = row.querySelector("img");
    if (r && r.photo) img.src = r.photo; else img.removeAttribute("src");
    row.querySelector("b").textContent = e.name + " (" + e.id + ")";
    const sm = row.querySelector("small");
    if (r) { const t = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleTimeString() : ""; sm.textContent = "Argameera " + t + (r.method === "qr" ? " · QR" : (r.fingerprint ? " · qubatti ✓" : " · suuraa qofa")); sm.className = "text-green-700"; }
    else { sm.textContent = "Hin argamne"; sm.className = "text-red-600"; }
    row.querySelector("button").onclick = async () => {
      if (!confirm(e.name + " haquu?")) return;
      try { await deleteDoc(doc(db, "employees", e.id)); try { await deleteDoc(doc(db, "pins", sec + "_" + e.id)); } catch (z) {} load(); } catch (x) { $("msg").textContent = "Haquu hin danda'amne."; }
    };
    L.appendChild(row);
  });
  $("nAll").textContent = emps.length; $("nP").textContent = p; $("nA").textContent = emps.length - p;
}

$("date").onchange = load;
$("addF").onsubmit = async ev => {
  ev.preventDefault();
  const code = $("newCode").value.trim().toUpperCase();
  try {
    await setDoc(doc(db, "employees", code), { name: $("newName").value.trim(), sectorId: sec, active: true });
    await setDoc(doc(db, "pins", sec + "_" + code), { sectorId: sec, pin: $("newPin").value.trim() });
    $("newCode").value = ""; $("newName").value = ""; $("newPin").value = ""; load();
  } catch (e) { $("msg").textContent = "Dabaluun hin danda'amne: " + (e.code || e.message); }
};

let qrTimer = null;
function loadJs(u) { return new Promise((ok, no) => { const t = document.createElement("script"); t.src = u; t.onload = ok; t.onerror = no; document.head.appendChild(t); }); }
async function ensureQR() {
  if (window.QRCode) return;
  for (const u of ["https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js", "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"]) {
    try { await loadJs(u); if (window.QRCode) return; } catch (e) {}
  }
  throw new Error("QR library fe'amuu hin dandeenye. Internet ilaali.");
}
async function qrTick() {
  const tok = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");
  await setDoc(doc(db, "qr", sec), { sectorId: sec, token: tok, exp: Date.now() + 90000 });
  const url = new URL("scan.html?s=" + sec + "&t=" + tok, location.href).href;
  await ensureQR();
  const box = $("qrc"); box.innerHTML = "";
  if (QRCode.toCanvas) { const c = document.createElement("canvas"); box.appendChild(c); QRCode.toCanvas(c, url, { width: 240 }, () => {}); }
  else { new QRCode(box, { text: url, width: 240, height: 240 }); }
}
$("qrOn").onclick = async () => {
  try { await qrTick(); } catch (e) { $("msg").textContent = "QR hin uumamne: " + (e.code || e.message); return; }
  $("qrBox").classList.remove("hidden"); clearInterval(qrTimer);
  qrTimer = setInterval(() => qrTick().catch(() => {}), 60000);
};
$("qrOff").onclick = async () => {
  clearInterval(qrTimer); $("qrBox").classList.add("hidden");
  try { await setDoc(doc(db, "qr", sec), { sectorId: sec, token: "off", exp: 0 }); } catch (e) {}
};
$("out").onclick = async () => { await signOut(auth); location.href = "./index.html"; };

$("csv").onclick = () => {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const rows = [["Guyyaa","Kutaa","Maqaa","Haala","Qubatti"]];
  emps.forEach(e => { const r = att[e.id]; rows.push([$("date").value, NAMES[sec] || sec, e.name, r ? "Argame" : "Hin argamne", r ? (r.fingerprint ? "eeyyee" : "hin") : ""]); });
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "argama-" + $("date").value + ".csv"; a.click();
};
</script>
</body>
</html>
